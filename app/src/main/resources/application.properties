server.port=8085
spring.application.name=mcp
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.enabled=false
spring.threads.virtual.enabled=true
spring.profiles.default=dev
spring.config.import=classpath:urls.yaml
spring.security.oauth2.client.registration.keycloak.client-id=mcp-client
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_SECRET:wQkxyxqw85zYthVspxv7UynH7PgdFhzF}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=urn:ietf:params:oauth:grant-type:token-exchange
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.keycloak.issuer-uri=${authorization.server.url}
# Keycloak client id of the ms-search backend; the exchanged token will carry it in "aud"
token-exchange.audience=${MS_SEARCH_AUDIENCE:ms-search-api}